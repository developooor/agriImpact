 return '<details class="workflow"><summary>Voir le suivi du projet et les blocages</summary><div class="stages"><div class="stage">Fiche enregistrée<br><small>'+date(h.created)+'</small></div><div class="stage '+(!finished?(attention?'blocked':'current'):'')+'">Activité en cours'+(!finished?'<br><strong>'+esc(h.status)+'</strong>':'')+'</div><div class="stage '+(finished?'current':'')+'">Activité terminée'+(finished?'<br><strong>Clôturée</strong>':'<br><small>Non terminée</small>')+'</div></div>'+(h.blocker?'<p class="blocker"><strong>Blocage déclaré</strong><br>'+userText(h.blocker,/^h\d+$/.test(h.id))+'</p>':h.status==='Vigilance'?'<p class="blocker"><strong>Point de vigilance à clarifier</strong><br>'+userText(h.note,/^h\d+$/.test(h.id))+'</p>':'<p class="muted">Aucun blocage renseigné.</p>')+'<p><strong>Dernière observation :</strong> '+userText(h.note,/^h\d+$/.test(h.id))+'</p>'+(h.events||[]).map(e=>'<div class="event">'+date(e.date)+' · '+userText(author(e.author))+'<br><strong>'+esc(e.status)+'</strong><p>'+userText(e.note)+'</p>'+(e.blocker?'<p class="red">'+userText(e.blocker)+'</p>':'')+'</div>').join('')+'<small>Les étapes non documentées ne sont pas reconstituées. Une activité terminée n’implique pas un accord de crédit.</small>'+(can('conseiller','admin')?'<p><button class="secondary" data-act="updateProgress" data-id="'+h.id+'">Mettre à jour le suivi</button></p>':'')+'</details>'
}

function fdaRelated(sim){const p=project(sim.project);if(!p)return [];const orchard=p.family==='Arboriculture';return FDA_RULES.filter(r=>{
 if(r.kind==='tree'||r.kind==='olive')return r.pid===p.id&&sim.params.stage==='Investissement';
 if(r.pid)return r.pid===p.id;
 if(r.kind==='hail')return orchard;
 if(['irrigation','solar'].includes(r.kind))return p.category==='Plantations'&&sim.params.mode==='Irrigué';
 if(r.kind==='building'||r.kind==='grinder')return ['p10','p11','p12','p13'].includes(p.id);

function validFdaEstimates(a){return a===undefined||Array.isArray(a)&&a.every(e=>e&&typeof e.ruleId==='string'&&typeof e.name==='string'&&typeof e.formula==='string'&&typeof e.source==='string'&&typeof e.status==='string'&&(e.amount===null||typeof e.amount==='number'&&Number.isFinite(e.amount)&&e.amount>=0)&&e.inputs&&typeof e.inputs==='object'&&!Array.isArray(e.inputs)&&['missing','failed','warnings'].every(k=>Array.isArray(e[k])&&e[k].every(t=>typeof t==='string')))}

 const sum=rows=>rows.reduce((a,r)=>{if(!Number.isFinite(r.min)||!Number.isFinite(r.max)||r.min<0||r.max<r.min)throw Error('Ligne de compte invalide');return {min:a.min+r.min,max:a.max+r.max}},{min:0,max:0});
 const debit=sum(data.expenses),credit=sum(data.income),recomputed={min:credit.min-debit.max,max:credit.max-debit.min};
 return {debit,credit,net:netBasis==='supplied'?{...data.suppliedNet}:recomputed,recomputed,netBasis};
}

// PDF autonome : pages dessinées en haute résolution puis encapsulées dans un vrai PDF.

function createSimulationPdf(sim,brandImage=null){
 const width=595.28,height=841.89,margin=46,usable=width-2*margin,scale=2,pages=[];
 let canvas,ctx,y;
 function newPage(){
  canvas=document.createElement('canvas');canvas.width=Math.ceil(width*scale);canvas.height=Math.ceil(height*scale);ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas indisponible');ctx.scale(scale,scale);ctx.direction=currentLanguage==='ary'?'rtl':'ltr';ctx.textAlign=currentLanguage==='ary'?'right':'left';ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#007732';ctx.fillRect(0,0,width,65);if(brandImage){const side=44,ratio=Math.min(side/brandImage.naturalWidth,side/brandImage.naturalHeight),w=brandImage.naturalWidth*ratio,h=brandImage.naturalHeight*ratio;ctx.drawImage(brandImage,currentLanguage==='ary'?margin:width-margin-side,10+(side-h)/2,w,h)}ctx.fillStyle='#FFFFFF';ctx.font='bold 15px Calibri, Arial, sans-serif';ctx.fillText(localize('Crédit Agricole du Maroc'),currentLanguage==='ary'?width-margin:margin,28);ctx.font='11px Calibri, Arial, sans-serif';ctx.fillText(localize('Agri-Impact · Rapport de simulation'),currentLanguage==='ary'?width-margin:margin,47);
  ctx.strokeStyle='#DDDDDD';ctx.beginPath();ctx.moveTo(margin,height-49);ctx.lineTo(width-margin,height-49);ctx.stroke();ctx.fillStyle='#64716A';ctx.font='9px Calibri, Arial, sans-serif';ctx.fillText(localize('POC confidentiel · Données fictives · Sans valeur contractuelle'),currentLanguage==='ary'?width-margin:margin,height-33);ctx.fillText(localize('Page')+' '+(pages.length+1),currentLanguage==='ary'?margin+38:width-margin-38,height-18);
  pages.push(canvas);y=93;
 }
 function text(value,{size=11,bold=false,color='#4A4A4A',gap=7,raw=false}={}){
  value=raw?String(value??''):localize(value);const lineHeight=size*1.45,font=(bold?'bold ':'')+size+'px Calibri, Arial, sans-serif';
  function line(t){if(y+lineHeight>height-68)newPage();ctx.font=font;ctx.fillStyle=color;ctx.fillText(t,currentLanguage==='ary'?width-margin:margin,y);y+=lineHeight}
  for(const paragraph of String(value??'Non renseigné').split(/\r?\n/)){
   ctx.font=font;let current='';
   for(const word of paragraph.split(/\s+/).filter(Boolean)){
    const candidate=current?current+' '+word:word;
    if(ctx.measureText(candidate).width<=usable){current=candidate;continue}
    if(current){line(current);current='';ctx.font=font}
    // Découpe également les longues références sans espaces, sans perte de contenu.
    for(const char of word){if(ctx.measureText(current+char).width>usable){line(current);current='';ctx.font=font}current+=char}
   }
   line(current);
  }
  y+=gap;
 }
 function heading(value){text(value,{size:14,bold:true,color:'#005122',gap:10})}
 const f=db.list('farmers').find(f=>f.id===sim.farmer),labels={location:'Implantation',quantity:project(sim.project)?.category==='Plantations'?'Superficie (ha)':'Nombre d’animaux',mode:'Périmètre',conduct:'Conduite',stage:'Stade',stable:'Superficie de l’étable (m²)',forage:'Ressources fourragères',feed:'Aliments du bétail',rain:'Précipitations (information)',competition:'Concurrence (information)'};
 newPage();text('Rapport de simulation',{size:25,bold:true,color:'#005122',gap:12});heading(project(sim.project)?.name||'Projet agricole');
 text((f?.nom||localize('Agriculteur'))+' · '+(f?.region||localize('Région non renseignée')),{raw:true});
 text(localize('Simulation du')+' '+date(sim.created)+' · '+author(sim.author),{raw:true});text('Référence : '+sim.id,{size:9,gap:15});heading('Paramètres du projet');
 Object.entries(labels).filter(([key])=>key in sim.params).forEach(([key,label])=>text(localize(label)+' : '+(String(sim.params[key]??'').trim()?(['location','rain','forage','feed'].includes(key)?String(sim.params[key]):localize(sim.params[key])):localize('Non renseigné')),{raw:true}));
 if(sim.oliveAccount){const a=sim.oliveAccount,t=oliveAccountTotals(a,'supplied'),range=v=>money(v.min)+' à '+money(v.max);heading(a.year===0?'Bilan d’investissement initial — Année 0':'Compte d’exploitation prévisionnel — Année 3');text('Arbequina · 1 hectare irrigué');text((a.year===0?'SOLDE NET — RESTE À CHARGE':'SOLDE NET ANNÉE 3')+' : '+range(t.net),{bold:true});text('TOTAL CRÉDIT : '+range(t.credit));text('TOTAL DÉBIT : '+range(t.debit));text('Solde et aides repris des images fournies : hypothèses à confirmer, aides non accordées. Crédit désigne les entrées, pas un emprunt. Hors postes non renseignés.');for(const [title,rows] of [['Débit — charges',a.expenses],['Crédit — entrées',a.income]]){heading(title);for(const row of rows){text(row.label+' : '+range(row),{bold:true});text(row.detail,{size:10})}}}else {heading('Estimation indicative');text(sim.label,{bold:true});text(sim.min!=null?money(sim.min)+' à '+money(sim.max):'Chiffrage à compléter',{size:18,bold:true,color:'#007732',gap:12});text(sim.detail);}
 if(Array.isArray(sim.fdaEstimates)&&sim.fdaEstimates.length){heading('Scénarios FDA — aides non accordées');for(const e of sim.fdaEstimates){text(e.name,{bold:true});text(e.status+(e.amount!=null?' : '+money(e.amount):''));text(e.formula,{size:10});for(const [label,value] of fdaInputDisplay(e))text(label+' : '+value,{size:9,gap:3});for(const t of [...(e.failed||[]),...(e.missing||[]),...(e.warnings||[])])text(t,{size:9,gap:4});text(e.source,{size:9})}text('Aides non additionnées et non déduites automatiquement du coût. Vérifier les cumuls et les assiettes au guichet unique.',{bold:true,size:10})}
 heading('À retenir');text('Les précipitations et la concurrence sont informatives : aucun effet sur les prix n’est calculé. Cette simulation ne constitue ni une demande de crédit, ni un accord de financement, ni une autorisation de démarrer les travaux.');text('Crédit Agricole du Maroc — Programme Intrapreneuriat',{size:9});
 // Assemblage PDF binaire : les offsets et longueurs sont comptés en octets.
 const encoder=new TextEncoder(),chunks=[],offsets=[0];let length=0;
 function append(value){const bytes=typeof value==='string'?encoder.encode(value):value;chunks.push(bytes);length+=bytes.byteLength}
 function object(number,body){offsets[number]=length;append(number+' 0 obj\n');append(body);append('\nendobj\n')}
 append('%PDF-1.4\n');object(1,'<< /Type /Catalog /Pages 2 0 R >>');object(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
 pages.forEach((page,i)=>{
  const pageId=3+i*3,contentId=pageId+1,imageId=pageId+2,raw=atob(page.toDataURL('image/jpeg',0.94).split(',')[1]),jpeg=Uint8Array.from(raw,c=>c.charCodeAt(0)),commands='q\n'+width+' 0 0 '+height+' 0 0 cm\n/Image1 Do\nQ\n';
  object(pageId,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+width+' '+height+'] /Resources << /XObject << /Image1 '+imageId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
  object(contentId,'<< /Length '+encoder.encode(commands).length+' >>\nstream\n'+commands+'endstream');offsets[imageId]=length;append(imageId+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+page.width+' /Height '+page.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');append(jpeg);append('\nendstream\nendobj\n');
 });
 const xref=length,count=3+pages.length*3;append('xref\n0 '+count+'\n0000000000 65535 f \n');for(let i=1;i<count;i++)append(String(offsets[i]).padStart(10,'0')+' 00000 n \n');append('trailer\n<< /Size '+count+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');return new Blob(chunks,{type:'application/pdf'});
}

  "Parcourez les dispositifs ou préparez une estimation à partir de zéro, sans projet enregistré.": "شوفو برامج الدعم أو وجدو تقدير من البداية بلا مشروع مسجل.",

  "Renseigner mes critères": "نعمّر المعطيات والشروط ديالي",
  "L’estimation teste des critères déclarés. Elle ne confirme ni l’éligibilité, ni une approbation, ni le versement. Le guichet unique DPA / ORMVA vérifie le dossier. Les cumuls ne sont pas calculés.": "هاد التقدير كيراجع المعطيات اللي صرّحتو بها. ما كيأكد لا الاستحقاق لا الموافقة لا صرف الدعم. الشباك الوحيد فـ DPA أو ORMVA هو اللي كيراجع الملف. جمع الإعانات ما كنحسبوهش.",
  "Terres collectives et jeunes": "الأراضي الجماعية والشباب",
  "Irrigation": "السقي",

  "Agrégation agricole": "التجميع الفلاحي",
  "Aide à l’investissement plafonnée à 20 ha : selon le régime, l’âge, les cultures et le niveau d’investissement. Les niveaux ne se cumulent pas. Aide à la location : 70 % du loyer, plafonds 2 500 MAD/ha/an, 50 000 MAD/projet/an et 150 000 MAD/projet ; durée et conditions spécifiques. Aides additionnelles calculées sur une subvention déjà perçue, pas sur le coût du projet.": "دعم الاستثمار محدد فـ 20 هكتار، حسب النظام والعمر والزراعة ومستوى الاستثمار. المستويات ما كتجمعش. دعم الكراء هو 70 % من الكراء، بسقوف 2 500 درهم للهكتار فالعام، و50 000 درهم للمشروع فالعام، و150 000 درهم للمشروع، وبشروط ومدد خاصة. الدعم الإضافي كيتحسب على إعانة توصل بها المستفيد، ماشي على تكلفة المشروع.",
  "Le seul statut Joumouâ ou Archia ne suffit pas. Conditions personnelles, contrat, dates, mainlevée et cumuls à instruire. Dispositions annoncées jusqu’au 31/12/2030. Information uniquement.": "كون الأرض جماعية أو عرشية بوحدو ما كافيش. خاص دراسة الوضعية الشخصية والعقد والتواريخ ورفع اليد وجمع الإعانات. المقتضيات مذكورة حتى 31/12/2030. هادشي غير للمعلومة.",
  "Irrigation localisée ou de complément, individuelle ou collective. Les taux et plafonds varient selon le régime, la taille totale de l’exploitation, les composantes et les quantités équipées.": "السقي الموضعي أو التكميلي، الفردي أو الجماعي. النسب والسقوف كتبدل حسب النظام والمساحة الإجمالية للضيعة والمكونات والكميات المجهزة.",
  "L’estimateur couvre uniquement l’irrigation localisée individuelle, hors agrégation. Approbation avant réalisation ; droits sur l’eau et lien foncier à justifier. Terme annoncé au 31/12/2027 ou à l’atteinte de 350 000 ha approuvés, quota non vérifiable ici.": "هاد التقدير غير للسقي الموضعي الفردي، خارج التجميع. خاص الموافقة قبل الإنجاز وإثبات الحق فالماء والعلاقة بالأرض. الأجل المذكور هو 31/12/2027 أو ملي توصل المساحة الموافق عليها لـ 350 000 هكتار. ما نقدرش نتحققو هنا من الحصة المستهلكة.",
  "30 % du coût du kit et de son installation, avec plafonds simultanés de 3 000 MAD/ha irrigué, 3 000 MAD/kWc et 30 000 MAD/projet.": "30 % من تكلفة التجهيز والتركيب، مع تطبيق السقوف كلها: 3 000 درهم للهكتار المسقي، و3 000 درهم لكل كيلوواط ذروة، و30 000 درهم للمشروع.",
  "Projet pilote : irrigation localisée fonctionnelle, pompage au butane, compteur et registre d’eau. Un seul projet aidé par exploitation ; disponibilité régionale à vérifier.": "برنامج تجريبي كيتطلب سقي موضعي خدام، وضخ الماء بالبوطا، وعداد وسجل استهلاك الماء. غير مشروع واحد مدعوم لكل ضيعة، والتوفر فالجهة خاصو التأكيد.",
  "Acquisition de génisses laitières importées : 6 000 MAD/tête ; sélectionnées et produites au Maroc : 3 000 MAD/tête. D’autres dispositifs concernent les reproducteurs camelins et la production de reproducteurs sélectionnés.": "شراء عجلات حلوب مستوردة: 6 000 درهم للرأس؛ والعجلات المنتقاة والمنتجة فالمغرب: 3 000 درهم للرأس. كاين حتى دعم لفحول الإبل وإنتاج حيوانات التكاثر المنتقاة.",
  "Les aides ne concernent pas tout animal acheté. Races, identification, pedigree ou gestation et justificatifs dépendent du dispositif. Pour les génisses : échéance au 31/12/2026 ou atteinte des quotas nationaux, non vérifiables ici.": "الدعم ما كيشملش أي حيوان تشرا. السلالة والترقيم والنسب أو الحمل والوثائق كيتبدلو حسب البرنامج. بالنسبة للعجلات، الأجل 31/12/2026 أو بلوغ الحصص الوطنية اللي ما نقدرش نتحققو منها هنا.",
  "Aides à la création de vergers : densités minimales, mode d’irrigation, coût des plants et plafonds par hectare. Le guide traite aussi des semences, des analyses de laboratoire et de la certification biologique.": "دعم إنشاء البساتين كيتعلق بالحد الأدنى لكثافة الغرس وطريقة السقي وثمن الشتلات والسقف للهكتار. الدليل فيه حتى البذور وتحاليل المختبر وشهادة الإنتاج البيولوجي.",
  "Semences : incohérences de campagne et mention de publication en attente p. 33 ; l’aide est répercutée par les semenciers, pas versée une seconde fois à l’agriculteur. Analyses : plafond non chiffré. Bio : tranche exactement 20 ha non explicitée p. 43. Ces trois volets restent informatifs.": "البذور: كاين اختلاف فالمواسم وذكر انتظار النشر فالصفحة 33؛ الدعم كينقص من ثمن البيع عند شركات البذور وما كيتصرفش مرة ثانية للفلاح. التحاليل: السقف ما محددش بالأرقام. البيولوجي: حالة 20 هكتار بالضبط ما واضحةش فالصفحة 43. هاد الجوانب كتبقى غير للمعلومة.",
  "Matériel agricole et d’élevage, bâtiments, serres et filets. Selon l’objet : taux du coût, plafonds par unité, hectare ou m² et limites d’unités selon la taille de l’exploitation.": "معدات الزراعة وتربية الماشية والبنايات والبيوت المغطاة والشباك. حسب المكون، كاين نسبة من التكلفة وسقف للوحدة أو للهكتار أو للمتر المربع، وعدد وحدات حسب حجم الضيعة.",
  "Estimateur limité aux objets explicitement proposés, au régime universel / première tranche. Les tranches d’agrégation et aides additionnelles ne sont pas ajoutées. Approbations ou accords avant investissement et normes techniques à vérifier.": "التقدير محدود فالمكونات المعروضة والنظام العام أو الشطر الأول. أشطر التجميع والدعم الإضافي ما كنزيدوهومش. خاص مراجعة الموافقات قبل الاستثمار والمعايير التقنية.",
  "Conditionnement, stockage, transformation et valorisation des produits végétaux ou animaux ; centres de collecte du lait. Barèmes et plafonds selon le type et parfois la capacité de l’unité.": "تلفيف وتخزين وتحويل وتثمين المنتوجات النباتية أو الحيوانية، ومراكز جمع الحليب. الجداول والسقوف حسب النوع وأحيانا طاقة الوحدة.",
  "Information uniquement : capacité, objet exact, autorisations et coûts éligibles doivent être instruits. Certaines valeurs du guide sont typographiquement ambiguës ; aucun montant global automatique.": "غير للمعلومة: خاص دراسة الطاقة والنشاط بالضبط والتراخيص والتكاليف المقبولة. بعض الأرقام فالدليل ما واضحةش فالطباعة، وما كنحسبوش مبلغ إجمالي أوتوماتيكي.",
  "Aides selon le produit, la destination, la campagne et le mode de transport. Certains dispositifs concernent les agrumes, produits animaux ou le transport aérien.": "الدعم حسب المنتوج والوجهة والموسم وطريقة النقل. بعض البرامج كتشمل الحوامض والمنتوجات الحيوانية أو النقل الجوي.",
  "Information uniquement. Une culture ne suffit pas à ouvrir une aide export : justificatifs douaniers, quantités, destinations et quotas restent à vérifier.": "غير للمعلومة. نوع الزراعة بوحدو ما كيعطيش الحق فدعم التصدير: خاص مراجعة الوثائق الجمركية والكميات والوجهات والحصص.",
  "Subventions en tranches et forfaits selon filière, catégorie de superficie ou de cheptel. La deuxième tranche dépend notamment des livraisons et des justificatifs d’agrégation.": "دعم على أشطر ومبالغ جزافية حسب السلسلة وصنف المساحة أو القطيع. الشطر الثاني كيتعلق خصوصا بالتسليمات ووثائق التجميع.",
  "Information uniquement. Ne pas additionner automatiquement taux universel, deuxième tranche et aide additionnelle. Attestation, première tranche déjà reçue et conditions de livraison à contrôler.": "غير للمعلومة. ما نجمعوش أوتوماتيكيا النظام العام والشطر الثاني والدعم الإضافي. خاص التحقق من الشهادة والشطر الأول اللي تصرف وشروط التسليم.",
  "Ce domaine reste informatif : aucun calcul automatique pour ces règles complexes ou incomplètes. Votre conseiller peut étudier les conditions avec vous.": "هاد المجال كيبقى للمعلومة: ما كاينش حساب أوتوماتيكي لهاد القواعد المعقدة أو الناقصة. المستشار يقدر يدرس الشروط معاكم.",

  "% du coût des plants, plafonné par hectare ; densité minimale selon espèce et conduite.": "% من ثمن الشتلات، بسقف للهكتار وكثافة دنيا حسب النوع وطريقة التدبير.",
  "Forfait de 3 500 ou 5 000 MAD/ha selon périmètre, goutte à goutte et densité. Hors replantation après feu bactérien.": "مبلغ جزافي ديال 3 500 أو 5 000 درهم للهكتار حسب السقي والتنقيط والكثافة. ما كيشملش إعادة الغرس من بعد مرض اللفحة النارية.",
  "70 % du coût des plants, plafond 35 000 MAD/ha, densité minimale 100 plants/ha. Réhabilitation en nature exclue de ce calcul.": "70 % من ثمن الشتلات، بسقف 35 000 درهم للهكتار وكثافة دنيا 100 شتلة للهكتار. التأهيل بدعم عيني خارج هاد الحساب.",
  "Calcul par composante et double plafond réseau / bassin. Taux selon la superficie totale exploitée, pas seulement celle du projet.": "الحساب لكل مكون مع سقف مستقل للشبكة وللحوض. النسبة حسب المساحة الإجمالية المستغلة، ماشي غير مساحة المشروع.",
  "Minimum de 30 % du coût, 3 000 MAD/ha, 3 000 MAD/kWc et 30 000 MAD/projet.": "الأقل بين 30 % من التكلفة، و3 000 درهم للهكتار، و3 000 درهم لكل كيلوواط ذروة، و30 000 درهم للمشروع.",
  "6 000 MAD par génisse de race laitière importée concernée, sous conditions et quota.": "6 000 درهم لكل عجلة حلوب مستوردة معنية، حسب الشروط والحصة المتوفرة.",
  "3 000 MAD par génisse laitière de race pure sélectionnée produite au Maroc, sous conditions et quota.": "3 000 درهم لكل عجلة حلوب من سلالة نقية منتقاة ومنتجة فالمغرب، حسب الشروط والحصة.",
  "25 % du coût de construction, plafond de 50 à 200 MAD/m² selon le bâtiment. Surfaces et plans conformes à justifier.": "25 % من تكلفة البناء، بسقف من 50 حتى 200 درهم للمتر المربع حسب البناية. خاص إثبات مطابقة المساحة والتصاميم.",
  "30 % du coût, plafond 6 000 MAD/unité, 1 ou 2 unités selon le cheptel exploité.": "30 % من التكلفة، بسقف 6 000 درهم للوحدة، ووحدة أو جوج حسب القطيع المستغل.",
  "30 % du coût d’acquisition, plafond 300 MAD par ruche peuplée.": "30 % من ثمن الشراء، بسقف 300 درهم لكل خلية نحل عامرة.",
  "25 % du coût, plafond de 3 à 27 MAD/m² couvert selon la composante. Un calcul par composante.": "25 % من التكلفة، بسقف من 3 حتى 27 درهم للمتر المربع المغطى حسب المكون. كل مكون كيتحسب بوحدو.",
  "35 % du coût, plafond 12 000 MAD/ha, pour les cultures maraîchères sous serre.": "35 % من التكلفة، بسقف 12 000 درهم للهكتار، لزراعة الخضرة داخل البيوت المغطاة.",
  "40 % du coût, plafond 50 000 MAD/ha, uniquement dans les provinces ou préfectures citées.": "40 % من التكلفة، بسقف 50 000 درهم للهكتار، غير فالأقاليم والعمالات المذكورة.",

  "Montants non additionnés : cumuls, assiettes et décisions à vérifier. Aucun montant n’est déduit automatiquement du coût du projet.": "المبالغ ما كتجمعش: خاص التحقق من الجمع بين الإعانات وأساس الحساب والقرارات. حتى مبلغ ما كيتنقص أوتوماتيكيا من تكلفة المشروع.",

const originalText=new WeakMap(),originalAttributes=new WeakMap();let languageObserver=null,languageApplying=false;
const normalizeFrench=s=>String(s).replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();
const languageLookup=new Map(Object.entries(DARIJA).map(([k,v])=>[normalizeFrench(k),v]));
const languageEscape=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const languagePatterns=[...new Set([...Object.keys(DARIJA),...Object.keys(DARIJA).map(k=>k.replace(/[’‘]/g,"'"))])].sort((a,b)=>b.length-a.length).map(s=>languageEscape(s).replace(/ /g,'\\s+'));
const languageRegex=new RegExp('(?<![\\p{L}\\p{N}_-])(?:'+languagePatterns.join('|')+')(?![\\p{L}\\p{N}_-])','gu');
function localize(value){const raw=String(value??'');if(currentLanguage!=='ary')return raw;const exact=languageLookup.get(normalizeFrench(raw));if(exact)return raw.replace(/\S[\s\S]*\S|\S/,exact);return raw.replace(languageRegex,match=>languageLookup.get(normalizeFrench(match))||match)}
function languageControl(root,id){
 if(!root||root.querySelector('.language-control'))return;
 const el=document.createElement('div');el.className='language-control';el.dataset.i18nSkip='true';el.innerHTML='<label for="'+id+'">Langue / اللغة</label><select id="'+id+'" aria-label="Langue / اللغة"><option value="fr" lang="fr">Français</option><option value="ary" lang="ary-MA">العربية – الدارجة المغربية</option></select>';root.append(el);el.querySelector('select').value=currentLanguage;el.querySelector('select').addEventListener('change',e=>setLanguage(e.target.value));
}
function refreshNavPosition(){const header=document.querySelector('.top'),banner=document.querySelector('.banner');if(header)document.documentElement.style.setProperty('--nav-top',Math.ceil(header.offsetHeight+(banner?.offsetHeight||0))+'px')}
function applyLanguage(){
 if(languageApplying)return;languageApplying=true;languageObserver?.disconnect();
 try{
  document.documentElement.lang=currentLanguage==='ary'?'ary-MA':'fr';document.documentElement.dir=currentLanguage==='ary'?'rtl':'ltr';
  languageControl(document.querySelector('.top'),'uiLanguage');if($('#modal').open)languageControl($('#modal'),'uiLanguageDialog');
  document.querySelectorAll('.language-control select').forEach(el=>{el.value=currentLanguage});
  // Toute option sans value explicite doit garder sa valeur française avant traduction.
  for(const root of [$('#app'),$('#modal'),$('#toast'),$('#storage')]){
   if(!root)continue;root.querySelectorAll('option').forEach(option=>{if(!option.hasAttribute('value'))option.value=option.value});
   const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;
   while(node=walker.nextNode()){
    if(!node.data.trim()||node.parentElement?.closest('script,style,textarea,input,.language-control,[data-i18n-skip],[data-user-text],#farmerSelect'))continue;
    let rec=originalText.get(node);if(!rec||node.data!==rec.output)rec={source:node.data,output:node.data};const next=localize(rec.source);if(node.data!==next)node.data=next;rec.output=next;originalText.set(node,rec);
   }
   root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(el=>{
    if(el.closest('.language-control,[data-i18n-skip]'))return;let records=originalAttributes.get(el)||{};
    for(const name of ['placeholder','aria-label','title']){if(!el.hasAttribute(name))continue;const value=el.getAttribute(name);let rec=records[name];if(!rec||rec.output!==value)rec={source:value,output:value};const next=localize(rec.source);if(next!==value)el.setAttribute(name,next);rec.output=next;records[name]=rec}originalAttributes.set(el,records);
   });
  }
  document.querySelectorAll('input:not([type=number]):not([type=email]):not([type=password]):not([type=tel]):not([type=date]),textarea').forEach(el=>{if(!el.hasAttribute('dir'))el.dir='auto'});refreshNavPosition();
 }finally{languageApplying=false;observeLanguage()}
}
function observeLanguage(){if(!languageObserver)return;for(const id of ['app','modal','toast','storage'])languageObserver.observe(document.getElementById(id),{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['placeholder','aria-label','title','open']})}
function setLanguage(language){if(!['fr','ary'].includes(language))return;currentLanguage=language;try{localStorage.setItem(LANGUAGE_KEY,language)}catch{}applyLanguage()}
languageObserver=new MutationObserver(applyLanguage);observeLanguage();window.addEventListener('resize',refreshNavPosition);

render();applyLanguage();
