let fdaFamily='',fdaContext=null,fdaCurrent=null;
function fdaRule(id){return FDA_RULES.find(r=>r.id===id)}
function fdaSource(r){return 'Guide FDA — édition 2026, p. '+r.page}
function fdaRelated(sim){const p=project(sim.project);if(!p)return [];const orchard=p.family==='Arboriculture';return FDA_RULES.filter(r=>{
 if(r.kind==='tree'||r.kind==='olive')return r.pid===p.id&&sim.params.stage==='Investissement';
 if(r.pid)return r.pid===p.id;
 if(r.kind==='hail')return orchard;
 if(['irrigation','solar'].includes(r.kind))return p.category==='Plantations'&&sim.params.mode==='Irrigué';
 if(r.kind==='building'||r.kind==='grinder')return ['p10','p11','p12','p13'].includes(p.id);
 return false;
})}

function fdaInputDisplay(e){const values={yes:'Oui, déclaré',no:'Non',universal:'Régime universel / première tranche',aggregation:'Agrégation à instruire',tied:'Étable moderne, stabulation entravée',free:'Étable moderne, stabulation libre',traditional:'Étable traditionnelle',sheepModern:'Bergerie / chèvrerie moderne',sheepTraditional:'Bergerie / chèvrerie traditionnelle',camel:'Abri pour camelins',metal:'Armature métallique',wood:'Armature en bois',tunnel:'Armature des tunnels métalliques',plastic:'Plastique et fil d’attache',outside:'Province hors liste'};return Object.entries(e.inputs||{}).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>[k==='area'?'Superficie ('+(['building','greenhouse'].includes(fdaRule(e.ruleId)?.kind)?'m²':'ha')+')':k==='power'?'Puissance ('+(e.ruleId==='solar'?'kWc':'kW')+')':FDA_INPUT_LABELS[k]||'Critère déclaré',k==='date'?date(v):values[v]||String(v)])}
function validFdaEstimates(a){return a===undefined||Array.isArray(a)&&a.every(e=>e&&typeof e.ruleId==='string'&&typeof e.name==='string'&&typeof e.formula==='string'&&typeof e.source==='string'&&typeof e.status==='string'&&(e.amount===null||typeof e.amount==='number'&&Number.isFinite(e.amount)&&e.amount>=0)&&e.inputs&&typeof e.inputs==='object'&&!Array.isArray(e.inputs)&&['missing','failed','warnings'].every(k=>Array.isArray(e[k])&&e[k].every(t=>typeof t==='string')))}

// PDF autonome : pages dessinées en haute résolution puis encapsulées dans un vrai PDF.
// Aucun serveur, bibliothèque distante ou fenêtre d’impression ; les accents sont préservés.
function createSimulationPdf(sim){
 const width=595.28,height=841.89,margin=46,usable=width-2*margin,scale=2,pages=[];
 let canvas,ctx,y;
 function newPage(){
  canvas=document.createElement('canvas');canvas.width=Math.ceil(width*scale);canvas.height=Math.ceil(height*scale);ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas indisponible');ctx.scale(scale,scale);ctx.fillStyle='#FFFFFF';ctx.fillRect(0,0,width,height);
  ctx.fillStyle='#007732';ctx.fillRect(0,0,width,65);ctx.fillStyle='#FFFFFF';ctx.font='bold 15px Calibri, Arial, sans-serif';ctx.fillText('Crédit Agricole du Maroc',margin,28);ctx.font='11px Calibri, Arial, sans-serif';ctx.fillText('AgriImpact · Rapport de simulation',margin,47);
  ctx.strokeStyle='#DDDDDD';ctx.beginPath();ctx.moveTo(margin,height-49);ctx.lineTo(width-margin,height-49);ctx.stroke();ctx.fillStyle='#64716A';ctx.font='9px Calibri, Arial, sans-serif';ctx.fillText('POC confidentiel · Données fictives · Sans valeur contractuelle',margin,height-33);ctx.fillText('Page '+(pages.length+1),width-margin-38,height-18);
  pages.push(canvas);y=93;
 }
 function text(value,{size=11,bold=false,color='#4A4A4A',gap=7}={}){
  const lineHeight=size*1.45,font=(bold?'bold ':'')+size+'px Calibri, Arial, sans-serif';
  function line(t){if(y+lineHeight>height-68)newPage();ctx.font=font;ctx.fillStyle=color;ctx.fillText(t,margin,y);y+=lineHeight}
  for(const paragraph of String(value??'Non renseigné').split(/\r?\n/)){
   ctx.font=font;let current='';
   for(const word of paragraph.split(/\s+/).filter(Boolean)){
    const candidate=current?current+' '+word:word;
    if(ctx.measureText(candidate).width<=usable){current=candidate;continue}
    if(current){line(current);current='';ctx.font=font}
    // Découpe également les longues références sans espaces, sans perte de contenu.
    for(const char of word){if(ctx.measureText(current+char).width>usable){line(current);current='';ctx.font=font}current+=char}
   }
   line(current);
  }
  y+=gap;
 }
 function heading(value){text(value,{size:14,bold:true,color:'#005122',gap:10})}
 const f=db.list('farmers').find(f=>f.id===sim.farmer),labels={location:'Implantation',quantity:project(sim.project)?.category==='Plantations'?'Superficie (ha)':'Nombre d’animaux',mode:'Périmètre',conduct:'Conduite',stage:'Stade',stable:'Superficie de l’étable (m²)',forage:'Ressources fourragères',feed:'Aliments du bétail',rain:'Précipitations (information)',competition:'Concurrence (information)'};
 newPage();text('Rapport de simulation',{size:25,bold:true,color:'#005122',gap:12});heading(project(sim.project)?.name||'Projet agricole');
 text((f?.nom||'Agriculteur')+' · '+(f?.region||'Région non renseignée'));
 text('Simulation du '+date(sim.created)+' · '+author(sim.author));text('Référence : '+sim.id,{size:9,gap:15});heading('Paramètres du projet');
 Object.entries(labels).filter(([key])=>key in sim.params).forEach(([key,label])=>text(label+' : '+(String(sim.params[key]??'').trim()||'Non renseigné')));
 heading('Estimation indicative');text(sim.label,{bold:true});text(sim.min!=null?money(sim.min)+' à '+money(sim.max):'Chiffrage à compléter',{size:18,bold:true,color:'#007732',gap:12});text(sim.detail);
 if(Array.isArray(sim.fdaEstimates)&&sim.fdaEstimates.length){heading('Scénarios FDA — aides non accordées');for(const e of sim.fdaEstimates){text(e.name,{bold:true});text(e.status+(e.amount!=null?' : '+money(e.amount):''));text(e.formula,{size:10});for(const [label,value] of fdaInputDisplay(e))text(label+' : '+value,{size:9,gap:3});for(const t of [...(e.failed||[]),...(e.missing||[]),...(e.warnings||[])])text(t,{size:9,gap:4});text(e.source,{size:9})}text('Aides non additionnées et non déduites automatiquement du coût. Vérifier les cumuls et les assiettes au guichet unique.',{bold:true,size:10})}
 heading('À retenir');text('Les précipitations et la concurrence sont informatives : aucun effet sur les prix n’est calculé. Cette simulation ne constitue ni une demande de crédit, ni un accord de financement, ni une autorisation de démarrer les travaux.');text('Crédit Agricole du Maroc — Programme Intrapreneuriat',{size:9});
 // Assemblage PDF binaire : les offsets et longueurs sont comptés en octets.
 const encoder=new TextEncoder(),chunks=[],offsets=[0];let length=0;
 function append(value){const bytes=typeof value==='string'?encoder.encode(value):value;chunks.push(bytes);length+=bytes.byteLength}
 function object(number,body){offsets[number]=length;append(number+' 0 obj\n');append(body);append('\nendobj\n')}
 append('%PDF-1.4\n');object(1,'<< /Type /Catalog /Pages 2 0 R >>');object(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
 pages.forEach((page,i)=>{
  const pageId=3+i*3,contentId=pageId+1,imageId=pageId+2,raw=atob(page.toDataURL('image/jpeg',0.94).split(',')[1]),jpeg=Uint8Array.from(raw,c=>c.charCodeAt(0)),commands='q\n'+width+' 0 0 '+height+' 0 0 cm\n/Image1 Do\nQ\n';
  object(pageId,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+width+' '+height+'] /Resources << /XObject << /Image1 '+imageId+' 0 R >> >> /Contents '+contentId+' 0 R >>');
  object(contentId,'<< /Length '+encoder.encode(commands).length+' >>\nstream\n'+commands+'endstream');offsets[imageId]=length;append(imageId+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+page.width+' /Height '+page.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');append(jpeg);append('\nendstream\nendobj\n');
 });
 const xref=length,count=3+pages.length*3;append('xref\n0 '+count+'\n0000000000 65535 f \n');for(let i=1;i<count;i++)append(String(offsets[i]).padStart(10,'0')+' 00000 n \n');append('trailer\n<< /Size '+count+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');return new Blob(chunks,{type:'application/pdf'});
}

?.id||id(),actif:active,motDePasse:old?.motDePasse||p.motDePasse,dateCreation:old?.dateCreation||today()})){closeModal();render();toast('Compte enregistré.')}return}if(form.id==='resetPasswordForm'){if(!guard('admin'))return;let u=db.list('users').find(u=>u.id===form.dataset.id);if(u&&db.upsert('users',{...u,motDePasse:p.newPassword})){closeModal();toast('Mot de passe réinitialisé.')}}});
